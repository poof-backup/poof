# See: https://github.com/poof-backup/poof/blob/master/LICENSE.txt

[build-system]
requires = [ 'setuptools' ]
build-backend = 'setuptools.build_meta'


[metadata]
url = 'https://github.com/poof-backup/poof'


[project]
authors = [
    { name = 'The poof-backup dev team', email = 'poof.project@cime.net' }
]
classifiers = [
    'Intended Audience :: Other Audience',
    'Operating System :: MacOS',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.7',
    'Topic :: System :: Archiving :: Backup',
    'Topic :: Utilities',
]
description = 'poof backup - instant, secure backup to a cloud drive'
dynamic = [
    'dependencies',
]
license = 'BSD-3-Clause'
name = 'poof'
readme = 'README.md'
requires-python = '>=3.7'
version = '1.5.0'


[project.scripts]
poof = 'poof.core:main'


[tool.pytest.ini_options]
addopts = '-sv -p no:warnings -rm --cov="poof" --cov-report=html --show-capture="no"'
testpaths = [
    'tests',
]
pythonpath = [
    '.',
]


[tool.setuptools]
include-package-data = true
packages = [
    'poof',
]


[tool.setuptools.dynamic]
dependencies = { file = 'requirements.txt' }

